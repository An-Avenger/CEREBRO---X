[project]
name = "cerebro-x"
version = "0.1.0"
description = "AI-Based Longitudinal Digital Brain Twin for Predicting Cognitive/Dementia Progression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Research use only — see data use agreements for OASIS-2 and ADNI" }
authors = [
    { name = "Aryan Sharma", email = "" }
]
keywords = ["neuroscience", "alzheimer", "digital-twin", "longitudinal", "mri", "machine-learning"]

# Core runtime dependencies (tabular pipeline only — Phase 0-3)
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pydantic>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
# Phase 5: Explainability
shap = ["shap>=0.42"]

# Phase 7: API
api = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy>=2.0",
]

# Phase 4+: Neural models
torch = [
    "torch>=2.0",
]

# Development / testing
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "ipykernel>=6.0",
    "notebook>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerebro_x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
