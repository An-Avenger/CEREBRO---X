
services:

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cerebro-x-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database across container restarts
      - cerebro_db:/data
    environment:
      - DATABASE_URL=sqlite:////data/cerebro_x.db
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cerebro_net

  # ─── Next.js Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cerebro-x-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cerebro_net

volumes:
  cerebro_db:
    driver: local

networks:
  cerebro_net:
    driver: bridge
